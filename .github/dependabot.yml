# ─────────────────────────────────────────────────────────────────────────────
# Dependabot — pengaturan ANTI-SPAM-EMAIL.
#
# SEBELUMNYA: Dependabot membuat Pull Request baru tiap minggu untuk update
# dependency → setiap PR mengirim EMAIL + memicu Security Scan (yang dulu
# sering gagal → email "Run failed" lagi). Hasilnya inbox banjir.
#
# SEKARANG (open-pull-requests-limit: 0): Dependabot TIDAK membuat PR update
# versi sama sekali. Yang tetap jalan:
#   - Dependabot SECURITY ALERTS → muncul di tab "Security" repo (BUKAN email
#     per-PR), memberitahu bila ada dependency yang benar-benar berbahaya.
#
# Update dependency cukup dilakukan manual/terjadwal oleh developer
# (npm outdated / npm audit fix) agar terkontrol dan tidak merusak aplikasi.
#
# Referensi: https://docs.github.com/en/code-security/dependabot
# ─────────────────────────────────────────────────────────────────────────────

version: 2
updates:
  # 1) Frontend (root) — npm  → 0 = tidak membuat PR versi (anti email-spam)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 0

  # 2) Backend (server/) — npm  → 0 = tidak membuat PR versi (anti email-spam)
  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 0

  # 3) Docker — nonaktif (tidak dipakai, hindari noise)
